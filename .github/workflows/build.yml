name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    # Input IDs are flake package names. Add new packages here with default: false.
    inputs:
      zeroclaw-full:
        description: zeroclaw-full
        type: boolean
        default: true
      context-summarizer:
        description: context-summarizer
        type: boolean
        default: false
      mihomo-get-zashboard:
        description: mihomo-get-zashboard
        type: boolean
        default: false
      mihomo-switch:
        description: mihomo-switch
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select:
    name: Select packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
    steps:
      - name: Read package checkboxes
        id: packages
        env:
          EVENT_NAME: ${{ github.event_name }}
          PACKAGE_INPUTS: ${{ toJSON(inputs) }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            packages=$(jq -c '[to_entries[] | select(.value == true) | .key]' <<< "$PACKAGE_INPUTS")
          else
            # Pushes and pull requests only build zeroclaw-full.
            packages='["zeroclaw-full"]'
          fi
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  build:
    needs: select
    if: needs.select.outputs.packages != '[]'
    name: ${{ matrix.package }} (${{ matrix.platform.system }})
    runs-on: ${{ matrix.platform.runner }}
    # zeroclaw-full compiles the whole Rust tree plus the gateway's npm
    # dashboard, with no upstream cache to fall back on.
    timeout-minutes: 300

    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.select.outputs.packages) }}
        platform:
          - system: x86_64-linux
            runner: ubuntu-latest
          # - system: aarch64-linux
          #   runner: ubuntu-24.04-arm
          # - system: aarch64-darwin
          #   runner: macos-latest
          # - system: x86_64-darwin
          #   runner: macos-13

    steps:
      # A hosted runner ships ~14GB free on /, which the Rust vendor tree, the
      # npm store and the build directory together overrun.
      - name: Reclaim runner disk space
        if: runner.os == 'Linux' && matrix.package == 'zeroclaw-full'
        # No tags are published; main is the documented reference.
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: false
          swap-storage: false

      # Upstream keeps `lto = "fat"` with `codegen-units = 1`, so the final
      # link is one rustc process holding the whole program. With every channel
      # and subsystem enabled that overruns the runner's 16GB, and lowering
      # build parallelism does not help because the step is serial by
      # construction. Back it with swap on the large temp disk instead.
      - name: Add swap
        if: runner.os == 'Linux' && matrix.package == 'zeroclaw-full'
        run: |
          sudo fallocate -l 32G /mnt/zeroclaw-swap
          sudo chmod 600 /mnt/zeroclaw-swap
          sudo mkswap /mnt/zeroclaw-swap
          sudo swapon /mnt/zeroclaw-swap
          free -h

      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - uses: cachix/cachix-action@v15
        with:
          name: sshawn9
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # A pull request from a fork has no access to the token; build it,
          # just do not try to push.
          skipPush: ${{ github.event_name == 'pull_request' }}

      - name: Build package
        env:
          NIX_SYSTEM: ${{ matrix.platform.system }}
          PACKAGE_NAME: ${{ matrix.package }}
        run: nix build --print-build-logs --no-link --no-write-lock-file ".#packages.${NIX_SYSTEM}.${PACKAGE_NAME}"
